version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db_backend
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sistema_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  # Microservicio de Ventas
  ventas:
    image: rodrigoruiz123/ms-ventas:latest
    container_name: ms_ventas
    depends_on:
      - db
    networks:
      - backend_net

  # Microservicio de Despachos
  despachos:
    image: rodrigoruiz123/ms-despachos:latest
    container_name: ms_despachos
    depends_on:
      - db
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data: