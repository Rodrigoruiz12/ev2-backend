version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db_backend
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sistema_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - backend_net

  ventas:
    image: rodrigoruiz123/ms-ventas:latest
    container_name: ms_ventas
    restart: always
    # FORZAMOS LOS LÍMITES AQUÍ DIRECTAMENTE
    entrypoint: ["java", "-Xmx128m", "-Xms64m", "-jar", "app.jar"]
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=user
      - DB_PASSWORD=password
      # LA LLAVE MÁGICA: allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sistema_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      - db
    networks:
      - backend_net

  despachos:
    image: rodrigoruiz123/ms-despachos:latest
    container_name: ms_despachos
    restart: always
    # FORZAMOS LOS LÍMITES AQUÍ TAMBIÉN
    entrypoint: ["java", "-Xmx128m", "-Xms64m", "-jar", "app.jar"]
    ports:
      - "8081:8081"
    environment:
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sistema_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      - db
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes: 
  mysql_data: